name: agent testbed
permissions:
  contents: read
on:
  pull_request:
  schedule:
    - cron: '30 9 * * *'
  workflow_dispatch:
jobs:
  matrix:
    name: ${{ matrix.persona }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        persona: [first-contact, automation]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Activate pinned Yarn
        run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - name: Run traced mock suites
        shell: bash
        run: |
          status=0
          node testbed/bin/testbed.mjs start --agent "${{ matrix.persona }}" --model scripted-ci --mode mock
          for suite in smoke query ingest-mock adversarial journeys/crm-to-activate; do
            node testbed/bin/testbed.mjs run --suite "$suite" || status=$?
          done
          node testbed/bin/testbed.mjs end || status=$?
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success()
        with:
          name: testbed-${{ matrix.persona }}
          path: |
            testbed/sessions/*/session.json
            testbed/sessions/*/events.jsonl
            testbed/sessions/*/events.jsonl.seq
            testbed/sessions/*/results.json
          retention-days: 7
          if-no-files-found: error
  report:
    needs: matrix
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Activate pinned Yarn
        run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - run: yarn install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: testbed-*
          path: testbed/sessions
          merge-multiple: true
      - run: node testbed/bin/testbed.mjs report --format both --output-dir testbed/reports
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: testbed-report
          path: testbed/reports/
          retention-days: 7
          if-no-files-found: error
