name: live NUT
permissions:
  contents: read
on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:
concurrency:
  group: data360-live-nut
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    environment: data360-live
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Activate pinned Yarn
        run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - name: Install stable Salesforce CLI
        run: npm install --global @salesforce/cli@2.144.6
      - name: Pack and install the exact plugin under test
        shell: bash
        run: |
          yarn pack --filename sf-plugin-data360.tgz
          node scripts/package-contents.mjs sf-plugin-data360.tgz
          tarball_url=$(node --input-type=module -e "import {pathToFileURL} from 'node:url'; console.log(pathToFileURL(process.cwd() + '/sf-plugin-data360.tgz').href)")
          if sf plugins trust allowlist add --name "$tarball_url" --json >/dev/null 2>&1; then
            sf plugins install "$tarball_url" --force --silent
          else
            printf 'y\n' | sf plugins install "$tarball_url" --force --silent
          fi
          sf plugins | grep 'sf-plugin-data360'
          sf data360 --help | grep 'Commands for Salesforce Data 360.'
      - name: Authenticate test org
        env:
          TESTKIT_AUTH_URL: ${{ secrets.TESTKIT_AUTH_URL }}
        run: |
          test -n "$TESTKIT_AUTH_URL"
          printf '%s' "$TESTKIT_AUTH_URL" | sf org login sfdx-url --sfdx-url-stdin --alias data360-live-ci
      - name: Run credential-gated read-only live NUTs
        env:
          D360_LIVE_ORG: data360-live-ci
        run: yarn test:nuts:live:readonly
